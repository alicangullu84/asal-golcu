<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1230">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Asal Golcü</title>
  <link rel="icon" href="gorseller/top.png">
  <link rel="stylesheet" href="stil.css?v=20261112">
</head>
<body>
  <main id="uygulama">
    <section id="ekran-giris" class="ekran"></section>
    <section id="ekran-menu" class="ekran"></section>
    <section id="ekran-harita" class="ekran"></section>
    <section id="ekran-maconcesi" class="ekran"></section>

    <section id="ekran-mac" class="ekran">
      <header class="tabela">
        <div class="tabela-takim">
          <span class="tabela-ad" id="t-ad">AKİF</span>
          <span class="tabela-skor" id="t-gol">0</span>
        </div>
        <div class="tabela-orta">
          <div class="tabela-mac" id="t-mac">Mahalle Maçı</div>
          <div class="tabela-poz" id="t-poz">Pozisyon 1/10</div>
          <div class="penalti-seri" id="penalti-seri"></div>
        </div>
        <div class="tabela-takim sag">
          <span class="tabela-skor" id="t-kurt">0</span>
          <span class="tabela-ad" id="t-rakip">UMUT</span>
        </div>
        <div class="tabela-ek">
          <span><b id="t-puan">0</b> puan</span>
          <span class="seri-rozet" id="t-seri">Seri 0</span>
        </div>
      </header>

      <div class="sahne-kap">
        <div class="sahne" id="sahne">
          <div class="kamera" id="kamera">
            <img class="sahne-arka" src="gorseller/stadyum.jpg" alt="" draggable="false">
            <div class="ag-katman" id="ag-katman"></div>
            <div class="klip-katman kaleci-katman" id="kaleci-katman"></div>
            <div class="kaleci-kap" id="kaleci-kap"><img id="kaleci" alt="Kaleci" draggable="false"></div>
            <div class="bolgeler" id="bolgeler"></div>
            <div class="top-golge" id="top-golge"></div>
            <div class="klip-katman golcu-katman" id="golcu-katman"></div>
            <img class="golcu" id="golcu" src="gorseller/golcu.png" alt="" draggable="false">
            <div class="top-iz" id="top-iz1"><img src="gorseller/top.png" alt=""></div>
            <div class="top-iz" id="top-iz2"><img src="gorseller/top.png" alt=""></div>
            <div class="top" id="top"><img id="top-gorsel" src="gorseller/top.png" alt="" draggable="false"><span id="top-yazi"></span></div>
          </div>
          <div class="soru-seridi" id="soru"></div>
          <div class="sure-cubugu" id="sure"><i></i></div>
          <div class="flas" id="flas"></div>
          <div class="buyuk-yazi" id="buyuk-yazi"></div>
          <div class="ayrilis-tabela" id="ayrilis"></div>
          <canvas class="konfeti" id="konfeti"></canvas>
        </div>
      </div>

      <footer class="alt-cubuk">
        <button class="kucuk-dugme" id="b-taktik" type="button">Taktik tahtası</button>
        <button class="kucuk-dugme joker" id="b-joker" type="button">Hoca taktiği</button>
        <div class="spiker" id="spiker" aria-live="polite"></div>
        <button class="kucuk-dugme tam-ekran-dugme" id="b-tam-ekran" type="button" data-tam-ekran>Tam Ekran</button>
        <button class="kucuk-dugme" id="b-duraklat" type="button">Duraklat</button>
      </footer>
      <div class="katman" id="katman" hidden></div>
    </section>

    <section id="ekran-macsonu" class="ekran"></section>
    <section id="ekran-album" class="ekran"></section>
    <section id="ekran-antrenman" class="ekran"></section>
    <section id="ekran-hoca" class="ekran"></section>
    <section id="ekran-ayarlar" class="ekran"></section>
    <section id="ekran-test" class="ekran"></section>
    <div class="modal" id="modal" hidden></div>
  </main>

  <script src="js/motor.js?v=20261112"></script>
  <script src="js/ses.js?v=20261112"></script>
  <script src="js/klip.js?v=20261112"></script>
  <script src="js/klipler.js?v=20261112"></script>
  <script src="js/test.js?v=20261112"></script>
  <script src="js/oyun.js?v=20261112"></script>
</body>
</html>
